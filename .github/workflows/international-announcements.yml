name: International announcements
on:
  pull_request:
    paths:
      - '.github/workflows/international-announcements.yml'
      - 'scripts/collect-international-announcements.mjs'
      - 'scripts/drain-public-announcement-queues.mjs'
      - 'scripts/permrock-announcements.mjs'
      - 'scripts/meta-announcements.mjs'
      - 'scripts/blackrock-announcements.mjs'
      - 'scripts/crane-announcements.mjs'
      - 'scripts/jpmorgan-announcements.mjs'
      - 'scripts/mastercard-announcements.mjs'
      - 'scripts/sec-dividend-announcements.mjs'
      - 'supabase/functions/sync-international-announcements/**'
  workflow_dispatch:
    inputs:
      probe_only:
        description: 'Consult public sources without reading or writing the queue'
        type: boolean
        default: true
  schedule:
    # GitHub may delay/drop scheduled runs. The collector catches up in bounded
    # public-source batches; paid providers retain one batch and their DB quotas.
    - cron: '8,23,38,53 * * * *'
permissions:
  contents: read
concurrency:
  group: international-announcements
  cancel-in-progress: false
jobs:
  public-source-probe:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.probe_only)
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - run: |
          python3 -m venv "$RUNNER_TEMP/valora-pdf"
          "$RUNNER_TEMP/valora-pdf/bin/pip" install --disable-pip-version-check pypdf==6.21.4
          echo "PDF_PYTHON=$RUNNER_TEMP/valora-pdf/bin/python" >> "$GITHUB_ENV"
      - name: Probe primary issuer distributions without queue writes
        run: |
          node --experimental-strip-types --input-type=module <<'NODE'
          import {permrockAnnouncements} from './scripts/permrock-announcements.mjs'
          import {craneAnnouncements} from './scripts/crane-announcements.mjs'
          import {blackrockAnnouncements} from './scripts/blackrock-announcements.mjs'
          import {metaAnnouncements} from './scripts/meta-announcements.mjs'
          for(const [ticker,source] of [['PRT',permrockAnnouncements],['META',metaAnnouncements],['BMN',blackrockAnnouncements],['CR',craneAnnouncements]]) {
            const events=await source(new Date().toISOString().slice(0,10))
            console.log(JSON.stringify({ticker,events:events.length}))
            if(!events.length)process.exitCode=1
          }
          NODE
      - run: node --experimental-strip-types scripts/collect-international-announcements.mjs
        name: Probe public sources without credentials
        env:
          INTERNATIONAL_PROBE_ONLY: 'true'
      - name: Probe official JPM discovery without queue or credentials
        run: |
          node --experimental-strip-types --input-type=module <<'NODE'
          import { jpmorganAnnouncements } from './scripts/jpmorgan-announcements.mjs'
          const events = await jpmorganAnnouncements(new Date().toISOString().slice(0,10))
          console.log(JSON.stringify({provider:'jpmorgan_ri',events:events.length}))
          NODE

      - name: Probe syndicated Mastercard issuer releases without queue or credentials
        run: |
          node --experimental-strip-types --input-type=module <<'NODE'
          import { mastercardAnnouncements } from './scripts/mastercard-announcements.mjs'
          const events = await mastercardAnnouncements(new Date().toISOString().slice(0,10))
          console.log(JSON.stringify({provider:'mastercard_nasdaq_release',events:events.length}))
          if(!events.length) process.exitCode=1
          NODE

      - name: Probe SEC discovery without queue or credentials
        run: |
          node --experimental-strip-types --input-type=module <<'NODE'
          import { discoverSecDividends } from './scripts/sec-dividend-announcements.mjs'
          const r = await discoverSecDividends('COST',new Date().toISOString().slice(0,10))
          console.log(JSON.stringify({provider:'sec',events:r.events.length,inspected:r.inspected,truncated:r.truncated,unsupported:r.unsupported}))
          if(!r.events.length) process.exitCode=1
          NODE
  collect:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.probe_only))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - run: |
          python3 -m venv "$RUNNER_TEMP/valora-pdf"
          "$RUNNER_TEMP/valora-pdf/bin/pip" install --disable-pip-version-check pypdf==6.21.4
          echo "PDF_PYTHON=$RUNNER_TEMP/valora-pdf/bin/python" >> "$GITHUB_ENV"
      - run: node --experimental-strip-types scripts/collect-international-announcements.mjs
