name: International announcements
on:
  pull_request:
    paths:
      - '.github/workflows/international-announcements.yml'
      - 'scripts/collect-international-announcements.mjs'
      - 'scripts/jpmorgan-announcements.mjs'
      - 'scripts/sec-dividend-announcements.mjs'
      - 'supabase/functions/sync-international-announcements/**'
  workflow_dispatch:
    inputs:
      probe_only:
        description: 'Consult public sources without reading or writing the queue'
        type: boolean
        default: true
  schedule:
    # Re-register scheduling after successful dispatches but no observed schedule
    # runs. Keep the same 15-minute interval; validate actual runs after merge.
    - cron: '8,23,38,53 * * * *'
permissions:
  contents: read
concurrency:
  group: international-announcements
  cancel-in-progress: false
jobs:
  public-source-probe:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.probe_only)
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - run: node --experimental-strip-types scripts/collect-international-announcements.mjs
        env:
          INTERNATIONAL_PROBE_ONLY: 'true'
      - name: Probe official JPM discovery without queue or credentials
        run: |
          node --experimental-strip-types --input-type=module <<'NODE'
          import { jpmorganAnnouncements } from './scripts/jpmorgan-announcements.mjs'
          const events = await jpmorganAnnouncements(new Date().toISOString().slice(0,10))
          console.log(JSON.stringify({provider:'jpmorgan_ri',events:events.length}))
          NODE

      - name: Probe SEC discovery without queue or credentials
        run: |
          node --experimental-strip-types --input-type=module <<'NODE'
          import { discoverSecDividends } from './scripts/sec-dividend-announcements.mjs'
          const r = await discoverSecDividends('COST',new Date().toISOString().slice(0,10))
          console.log(JSON.stringify({provider:'sec',events:r.events.length,inspected:r.inspected,truncated:r.truncated,unsupported:r.unsupported}))
          if(!r.events.length) process.exitCode=1
          NODE
  collect:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.probe_only))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - run: node --experimental-strip-types scripts/collect-international-announcements.mjs
