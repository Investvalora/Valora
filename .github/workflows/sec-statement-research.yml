name: SEC statement research
on:
  workflow_dispatch:
  schedule:
    - cron: '41 * * * *'
permissions:
  contents: read
concurrency:
  group: sec-statement-research
  cancel-in-progress: false
jobs:
  research:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      # Short-lived OIDC, main-only. Bounded queue for active US stock catalog;
      # statements are isolated from personal holdings and existing fundamentals.
      - name: Collect and store validated annual statement evidence
        run: node --experimental-strip-types scripts/sync-sec-statement-catalog.mjs
